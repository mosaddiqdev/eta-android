# Builds the Android app and publishes the APK as a GitHub release (a direct download, not a zip).
# How it works, the signing secrets and the toolchain versions: docs/android.md
name: Android

on:
  workflow_dispatch:
    inputs:
      debug:
        description: Show the on-screen layout numbers (for tracking down a gap at the top)
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to create a release for a tag
    steps:
      - uses: actions/checkout@v7

      # Node 24 from .nvmrc: the game data package needs it, and Capacitor 8 needs 22 or newer.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run android
        env:
          PUBLIC_DEBUG_INSETS: ${{ inputs.debug && '1' || '' }}

      # Capacitor 8 builds with Java 21 (Android Gradle Plugin 8.13, Android SDK 36).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android

      # The runner image already has the Android SDK. This only makes sure the pieces the template asks for are there.
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      # With the four signing secrets (see docs/android.md) the one APK is the signed release build, which installs over
      # the previous one. Without them the only option is a debug build, whose key changes every run, so it can't update.
      - name: Build and sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-apk
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::No signing secrets, so this is a debug APK that can't be installed over an older build."
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/ClashETA.apk
            exit 0
          fi
          (cd android && ./gradlew --no-daemon assembleRelease)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KEYSTORE_PASSWORD" K_PASS="$KEY_PASSWORD" "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out dist-apk/ClashETA.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify dist-apk/ClashETA.apk
          rm -f "$RUNNER_TEMP/release.jks"

      # Kept as a run artifact too, but that downloads as a zip; the release below is the direct APK link.
      - uses: actions/upload-artifact@v7
        with:
          name: eta-apk
          path: dist-apk/ClashETA.apk
          if-no-files-found: error

      # A tag like v0.1.0 publishes a normal release. Any other run replaces one rolling "latest build" release, so the
      # newest APK is always at https://github.com/<owner>/<repo>/releases/download/latest-build/ClashETA.apk
      # Only a run someone started by hand, or a tag, publishes. A merge to main builds and checks, but does not replace the
      # APK you are testing from another branch.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist-apk/ClashETA.apk --generate-notes
          else
            gh release delete latest-build --cleanup-tag --yes 2>/dev/null || true
            gh release create latest-build dist-apk/ClashETA.apk --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Built from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Open this on your phone and tap ClashETA.apk."
          fi
